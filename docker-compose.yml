services:
  camelot-wheel:
    container_name: tools-camelot
    build: .
    image: ghcr.io/endothedev/camelot-wheel:latest
    labels:
      - "traefik.enable=true"
      # ponytail: NO strip-prefix - the app sets baseURL /tools/camelot-wheel/ and
      # expects the full path (asset urls resolve under it). stripping caused the
      # redirect loop between app root and real path.
      - "traefik.http.routers.tools-camelot.rule=Host(`endothe.dev`) && PathPrefix(`/tools/camelot-wheel`)"
      - "traefik.http.services.tools-camelot.loadbalancer.server.port=3000"
    networks:
      - services
    restart: unless-stopped

networks:
  services:
    external: true