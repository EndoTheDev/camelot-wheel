services:
  camelot-wheel:
    container_name: tools-camelot
    build: .
    image: ghcr.io/endothedev/camelot-wheel:latest
    labels:
      - "traefik.enable=true"
      # ponytail: PathPrefix rule per tool - the /tools/... convention settled in planning
      - "traefik.http.routers.tools-camelot.rule=Host(`endothe.dev`) && PathPrefix(`/tools/camelot-wheel`)"
      - "traefik.http.services.tools-camelot.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.tools-camelot-stripprefix.stripprefix.prefixes=/tools/camelot-wheel"
      - "traefik.http.routers.tools-camelot.middlewares=tools-camelot-stripprefix"
    networks:
      - services
    restart: unless-stopped

networks:
  services:
    external: true